<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Grid</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            padding: 30px;
            min-height: 100vh;
            color: #fff;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
        }
        .card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            position: relative;
        }
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 8px;
            background: linear-gradient(90deg, #ff6b6b, #feca57, #48dbfb, #ff9ff3);
            background-size: 400% 100%;
            animation: shimmer 3s infinite;
        }
        @keyframes shimmer {
            0% { background-position: -400%; }
            100% { background-position: 400%; }
        }
        .card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.3);
        }
        .card img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            display: block;
            transition: transform 0.4s ease;
        }
        .card:hover img {
            transform: scale(1.05);
        }
        .card-content {
            padding: 20px;
            text-align: center;
        }
        .card-content h3 {
            font-size: 1.5rem;
            color: #fff;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            margin-top: 10px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        @media (max-width: 1200px) {
            .grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }
            .card img {
                height: 350px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="grid">
            <div class="card">
                <img src="https://cataas.com/cat/cute/says/Fluffy%20Persian" alt="Fluffy Persian">
                <div class="card-content">
                    <h3>Fluffy Persian</h3>
                </div>
            </div>
            <div class="card">
                <img src="https://cataas.com/cat/cute/says/Siamese%20Beauty" alt="Siamese Beauty">
                <div class="card-content">
                    <h3>Siamese Beauty</h3>
                </div>
            </div>
            <div class="card">
                <img src="https://cataas.com/cat/cute/says/Maine%20Coon%20Giant" alt="Maine Coon Giant">
                <div class="card-content">
                    <h3>Maine Coon Giant</h3>
                </div>
            </div>
            <div class="card">
                <img src="https://cataas.com/cat/cute/says/Bengal%20Spots" alt="Bengal Spots">
                <div class="card-content">
                    <h3>Bengal Spots</h3>
                </div>
            </div>
            <div class="card">
                <img src="https://cataas.com/cat/cute/says/Ragdoll%20Relax" alt="Ragdoll Relax">
                <div class="card-content">
                    <h3>Ragdoll Relax</h3>
                </div>
            </div>
            <div class="card">
                <img src="https://cataas.com/cat/cute/says/Sphynx%20Unique" alt="Sphynx Unique">
                <div class="card-content">
                    <h3>Sphynx Unique</h3>
                </div>
            </div>
            <div class="card">
                <img src="https://cataas.com/cat/cute/says/Scottish%20Fold" alt="Scottish Fold">
                <div class="card-content">
                    <h3>Scottish Fold</h3>
                </div>
            </div>
            <div class="card">
                <img src="https://cataas.com/cat/cute/says/British%20Shorthair" alt="British Shorthair">
                <div class="card-content">
                    <h3>British Shorthair</h3>
                </div>
            </div>
            <div class="card">
                <img src="https://cataas.com/cat/cute/says/Abyssinian" alt="Abyssinian">
                <div class="card-content">
                    <h3>Abyssinian</h3>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
